name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Verify git tag matches manifest versions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const tagVer = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            const files = ["plugin.json", "package.json", "server/package.json"];
            for (const f of files) {
              const v = JSON.parse(fs.readFileSync(f, "utf8")).version;
              if (v !== tagVer) {
                console.error(`Version mismatch: tag=${tagVer}, ${f}=${v}`);
                process.exit(1);
              }
            }
            console.log(`Verified tag v${tagVer} matches all manifests.`);
          '

      - name: Install server dependencies
        run: pnpm --dir server install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir server typecheck

      - name: Build zero-dependency bundle
        run: pnpm --dir server build

      - name: Run offline provider & parser tests
        run: pnpm --dir server test:providers

      - name: Run standalone zero-dependency plugin test
        run: pnpm --dir server test:standalone

      - name: Package GitHub Release archives
        run: node scripts/package-release.mjs

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/agy-ext-swarm*.tar.gz
            release/agy-ext-swarm*.zip
            release/SHA256SUMS.txt

      - name: Publish to npm (if NPM_TOKEN is configured)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm publish --access public
          else
            echo "::notice::NPM_TOKEN secret is not configured; skipping npm publish."
          fi
